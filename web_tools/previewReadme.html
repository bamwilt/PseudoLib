---

PseudoLib es una librería de pseudocódigo desarrollada para PSeInt. Su objetivo es ampliar las posibilidades del entorno mediante la simulación de estructuras y funciones que no ofrece de forma nativa. Se basa principalmente en Java, con ideas de JavaScript, C y otros lenguajes, sin reproducir fielmente uno en particular.

**Versión actual: 0.9.7** · La versión anterior, 0.9.3, se conserva en [src/PseudoLib_old.psc](src/PseudoLib_old.psc). El código actual está en [src/PseudoLib.psc](src/PseudoLib.psc).

> [!IMPORTANT]
> Este proyecto es experimental y no tiene un fin pedagógico específico. Para su uso y comprensión se requieren bases de programación. Puede utilizarse para explorar las funciones y observar su comportamiento.

  <script>
    // Renderer limitado al Markdown usado aquí: texto escapado, sin ejecutar HTML.
    const article = document.getElementById('readme');
    const status = document.getElementById('status');
    const root = new URL('../', location.href);
    const escape = text => text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function url(path) {
      try {
        const resolved = new URL(path, root);
        return ['http:', 'https:', 'file:'].includes(resolved.protocol) ? escape(resolved.href) : '#';
      } catch { return '#'; }
    }
    function inline(text) {
      const tokens = [];
      const token = html => '\u0000' + (tokens.push(html) - 1) + '\u0000';
      text = text.replace(/\u0000/g, '');
      text = text.replace(/`([^`]+)`/g, (_, code) => token('<code>' + escape(code) + '</code>'));
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, path) => token('<img src="' + url(path) + '" alt="' + escape(alt) + '">'));
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, path) => token('<a href="' + url(path) + '">' + escape(label) + '</a>'));
      return escape(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\u0000(\d+)\u0000/g, (_, i) => tokens[Number(i)]);
    }
    function render(markdown) {
      const lines = markdown.replace(/\r/g, '').trim().split('\n').map(line => line.trimEnd());
      const html = [];
      const cells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const special = line => !line.trim() || /^(#{1,6}\s|---\s*$|>\s?|\||- )/.test(line);
      for (let i = 0; i < lines.length;) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        if (/^---\s*$/.test(line)) { html.push('<hr>'); i++; continue; }
        const heading = line.match(/^(#{1,6})\s+(.+)/);
        if (heading) { const n = heading[1].length; html.push('<h' + n + '>' + inline(heading[2]) + '</h' + n + '>'); i++; continue; }
        if (line.startsWith('|') && i + 1 < lines.length && /^\|[\s:|\-]+$/.test(lines[i + 1])) {
          const headers = cells(line), align = cells(lines[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : 'left');
          const row = (values, tag) => '<tr>' + values.map((c, j) => '<' + tag + ' style="text-align:' + align[j] + '">' + inline(c) + '</' + tag + '>').join('') + '</tr>';
          let table = '<div class="table-scroll"><table><thead>' + row(headers, 'th') + '</thead><tbody>';
          i += 2;
          while (i < lines.length && lines[i].startsWith('|')) table += row(cells(lines[i++]), 'td');
          html.push(table + '</tbody></table></div>'); continue;
        }
        if (line.startsWith('>')) {
          const quote = [];
          while (i < lines.length && lines[i].startsWith('>')) quote.push(lines[i++].replace(/^> ?/, ''));
          const alert = quote[0].match(/^\[!(IMPORTANT|NOTE)\]$/);
          if (alert) {
            const important = alert[1] === 'IMPORTANT';
            const icon = important ? '<path d="M4.75.75h6.5A2.75 2.75 0 0 1 14 3.5v5A2.75 2.75 0 0 1 11.25 11h-4.3L3.5 14.5V11A2.75 2.75 0 0 1 2 8.5v-5A2.75 2.75 0 0 1 4.75.75Z" fill="none" stroke="currentColor"/><path d="M8 3v3m0 1.5v1" stroke="currentColor" stroke-width="1.5"/>' : '<path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v4m0-7v1" stroke="currentColor" stroke-width="1.5"/>';
            html.push('<div class="markdown-alert ' + (important ? 'important' : 'note') + '"><p class="alert-title"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">' + icon + '</svg>' + (important ? 'Important' : 'Note') + '</p><p>' + inline(quote.slice(1).join('\n')) + '</p></div>');
          } else html.push('<blockquote><p>' + inline(quote.join('\n')) + '</p></blockquote>');
          continue;
        }
        if (line.startsWith('- ')) {
          let list = '<ul>';
          while (i < lines.length && lines[i].startsWith('- ')) list += '<li>' + inline(lines[i++].slice(2)) + '</li>';
          html.push(list + '</ul>'); continue;
        }
        const paragraph = [lines[i++]];
        while (i < lines.length && !special(lines[i])) paragraph.push(lines[i++]);
        html.push('<p>' + inline(paragraph.join('\n')) + '</p>');
      }
      article.innerHTML = html.join('\n');
    }
    render(document.getElementById('snapshot').textContent);
    // En HTTP se lee el README real; file:// usa la instantánea por las restricciones del navegador.
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      fetch(new URL('README.md', root), { cache:'no-store' }).then(response => {
        if (!response.ok) throw new Error('README no disponible');
        return response.text();
      }).then(text => { render(text); status.textContent = 'README.md actualizado desde el repositorio'; })
        .catch(() => { status.textContent = 'No se pudo leer README.md; mostrando la copia incluida. Puedes cargarlo manualmente.'; });
    }
    document.getElementById('file').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      try { render(await file.text()); status.textContent = 'Vista del archivo: ' + file.name; }
      catch { status.textContent = 'No se pudo leer el archivo. Selecciona README.md de nuevo.'; }
    });
    document.getElementById('theme').addEventListener('click', event => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      event.currentTarget.textContent = dark ? 'Tema claro' : 'Tema oscuro';
      event.currentTarget.setAttribute('aria-pressed', String(dark));
    });
  </script>
